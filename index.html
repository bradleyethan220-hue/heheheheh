<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Updated Idiot Game</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    overflow: hidden;
    font-family: Arial;
  }

  #startScreen {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: black;
    z-index: 2000;
  }

  #startScreen button {
    padding: 14px 28px;
    font-size: 26px;
    cursor: pointer;
  }

  #ransomVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    z-index: 1500;
  }

  #message {
    position: fixed;
    inset: 0;
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 48px;
    background: black;
    z-index: 1600;
  }

  #face {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 500;
  }

  #faceBox {
    width: 300px;
    height: 300px;
    background: red;
    border-radius: 50%;
  }

  #hud {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.5);
    padding: 10px;
    border-radius: 8px;
    z-index: 600;
  }

  #explorer {
    position: fixed;
    right: 20px;
    top: 20px;
    width: 260px;
    height: 400px;
    background: #111;
    border: 2px solid #333;
    padding: 10px;
    overflow-y: auto;
    z-index: 600;
  }

  .file {
    background: #222;
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 4px;
  }

  .popup {
    position: absolute;
    width: 220px;
    height: 120px;
    background: #111;
    border: 2px solid red;
    border-radius: 6px;
    box-shadow: 0 0 20px black;
    padding: 10px;
    z-index: 800;
    color: white;
    font-size: 18px;
  }

  #endScreen {
    position: fixed;
    inset: 0;
    background: black;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-size: 48px;
    z-index: 2000;
  }
</style>
</head>
<body>

<div id="startScreen">
  <button id="startBtn">Run Application</button>
</div>

<video id="ransomVideo" src="ransom appears.mp4" controls></video>
<audio id="ransomAudio" src="ransom appears.mp3"></audio>

<div id="message">Awh, you beat me!</div>

<div id="face">
  <div id="faceBox"></div>
</div>

<div id="hud">
  Time: <span id="time">60</span>s<br>
  Coins: <span id="coins">0</span>
</div>

<div id="explorer">
  <h2>Files</h2>
  <div id="files"></div>
</div>

<div id="endScreen">Thank You</div>

<script>
let ransomFinished = false;
let timeLeft = 60;
let coins = 0;
let spawning = false;

const startScreen = document.getElementById("startScreen");
const startBtn = document.getElementById("startBtn");
const video = document.getElementById("ransomVideo");
const audio = document.getElementById("ransomAudio");
const message = document.getElementById("message");
const files = document.getElementById("files");
const endScreen = document.getElementById("endScreen");

startBtn.onclick = () => {
  startScreen.style.display = "none";
  video.style.display = "block";
  video.play();
};

video.onended = () => {
  video.style.display = "none";
  message.style.display = "flex";
  ransomFinished = true;
};

document.addEventListener("mousemove", () => {
  if (!ransomFinished) return;

  message.style.display = "none";
  audio.play();
  startMinigame();
  ransomFinished = false;
});

function startMinigame() {
  spawning = true;

  setInterval(() => {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;
    if (timeLeft <= 0) {
      endScreen.style.display = "flex";
    }
  }, 1000);

  let popupInterval = setInterval(() => {
    if (!spawning) return;

    const p = document.createElement("div");
    p.className = "popup";
    p.textContent = "You are an idiot.";

    p.style.left = Math.random() * (window.innerWidth - 240) + "px";
    p.style.top = Math.random() * (window.innerHeight - 160) + "px";

    p.onclick = () => p.remove();

    document.body.appendChild(p);
  }, 600);

  setTimeout(() => {
    spawning = false;
    clearInterval(popupInterval);
  }, 30000);

  setInterval(() => {
    const coin = document.createElement("div");
    coin.className = "file";
    coin.textContent = "Coin_" + Math.floor(Math.random() * 9999);
    files.appendChild(coin);
    coins++;
    document.getElementById("coins").textContent = coins;
  }, 1500);
}
</script>

</body>
</html>
